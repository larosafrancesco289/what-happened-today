name: Daily edition

on:
  schedule:
    # GitHub often starts scheduled runs hours late, so aim early.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job per language, in parallel: a failure in one never blocks the others,
  # but it does turn the run red so it gets noticed.
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lang: [en, it, fr]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: echo "DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: bun src/pipeline/run.ts ${{ matrix.lang }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: edition-${{ matrix.lang }}
          path: data/${{ matrix.lang }}/${{ env.DATE }}.json
          if-no-files-found: error

  # Commit whatever editions succeeded in a single commit, so the site deploys once.
  publish:
    needs: edition
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: edition-*
          path: incoming
      - name: Commit editions
        run: |
          for lang in en it fr; do
            if [ -d "incoming/edition-$lang" ]; then cp incoming/edition-$lang/*.json "data/$lang/"; fi
          done
          git add data/
          if git diff --staged --quiet; then
            echo "No editions to publish"
            exit 0
          fi
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git commit -m "Daily news update: $(date -u +%F)"
          git push
      - name: Deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"; fi
